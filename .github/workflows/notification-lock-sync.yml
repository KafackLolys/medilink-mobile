name: Update Expo notifications lockfile once
on:
  push:
    branches: [docs/mobile-audit-parity-2026-11-13]
    paths:
      - package.json
      - .github/workflows/notification-lock-sync.yml
permissions:
  contents: write
jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mobile-audit-parity-2026-11-13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Expo SDK 58 lockfile exactly
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to existing branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package-lock.json
            git commit -m "build(android): resolve Expo SDK 58 notification dependencies"
            git push origin HEAD:docs/mobile-audit-parity-2026-11-13
          fi
