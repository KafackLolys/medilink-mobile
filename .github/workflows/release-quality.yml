name: Medilink release quality gates
on:
  push:
    branches: [docs/mobile-audit-parity-2026-11-13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run typecheck
      - name: Expo SDK 58 Doctor
        if: always()
        run: npm run doctor
      - name: ESLint (Expo)
        if: always()
        run: npm run lint
      - name: All domain and release tests
        if: always()
        run: npm run test:release && npm run test:ux
