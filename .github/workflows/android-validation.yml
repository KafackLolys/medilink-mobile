name: Medilink Android validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'eas.json'
      - 'app.json'
      - 'app.config.js'
      - 'google-services.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

jobs:
  native-auth-and-http:
    name: TypeScript and API/auth unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run release:validate
      - run: node --test scripts/startup-validation.test.mjs
      - run: node --test scripts/release-config.test.mjs
      - run: npm run test:http
      - run: npm run test:auth
      - run: npm run test:session
      - run: npm run test:onboarding
      - run: npm run test:patient
      - run: npm run test:doctors
      - run: npm run test:doctor-profile
      - run: npm run test:needs
      - run: npm run test:appointments
      - run: npm run test:patient-profile
      - run: npm run test:doctor-dashboard
      - run: npm run test:doctor-needs
      - run: npm run test:doctor-agenda
      - run: npm run test:doctor-profile-edit
      - run: npm run test:messaging
      - run: npm run test:notifications
      - run: npm run test:documents
      - run: npm run test:geo
      - run: npm run test:reviews
      - run: npm run test:admin
      - run: npm run test:network
      - run: npm run test:ux
      - name: Verify Metro Android JavaScript bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: https://medilink-api-lilac.vercel.app
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 353233115193-k7evhvj5518cgp52p17fe6tmmrp64a8h.apps.googleusercontent.com
          EXPO_PUBLIC_FIREBASE_API_KEY: PLACEHOLDER_ONLY_FOR_BUNDLING
        run: npx expo export --platform android --output-dir /tmp/medilink-android-bundle
