name: One-time Expo Network dependency lock sync
on:
  push:
    branches: [docs/mobile-audit-parity-2026-11-13]
    paths:
      - 'package.json'
      - '.github/workflows/network-lock-sync.yml'
permissions:
  contents: write
jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mobile-audit-parity-2026-11-13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock Expo SDK 58 dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Update lockfile in the same branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package-lock.json
            git commit -m "build(network): lock Expo SDK58 expo-network dependency"
            git push origin HEAD:docs/mobile-audit-parity-2026-11-13
          fi
